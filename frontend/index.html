<main>

    <p class="attrib" data-cfg-text="home.manifestoAttrib"></p>
  </section>

  <div class="collections" id="collections"></div>

  <section class="artist shell" data-reveal>
    <div class="artist-grid">
      <div class="artist-portrait" data-reveal="left" data-cfg-holder hidden>
        <img alt="" loading="lazy" data-cfg-src="home.artistPortrait" hidden>
      </div>
      <div class="artist-copy" data-reveal="right">
        <span class="eyebrow" data-cfg-text="home.artistEyebrow"></span>
        <h2 data-cfg-text="home.artistName"></h2>
        <div data-artist-copy></div>

    </div>
  </section>

  <section class="story" id="story-section" hidden></section>

  <section class="finale">
    <div class="marquee" aria-hidden="true" hidden>
      <span data-collection-marquee></span>
    </div>
    <div class="shell" data-reveal>
      <span class="eyebrow" data-cfg-text="home.finaleEyebrow"></span>
